[project]
name = "argox"
version = "0.2.1"
description = "Argox SDK: policy checks + telemetry for any Python agent, via the generic /v1/tool-call API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argox*"]
